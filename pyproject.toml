[project]
name = "ocr-api-gateway"
version = "0.1.0"
description = "Microservicio FastAPI que actua como proxy hacia la API de OCR de OCR.space"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.12,<0.1",
    "filetype>=1.2,<2.0",
    "pillow>=10.4,<12.0",
    "pikepdf>=9.3,<10.0",
    "pymupdf>=1.24.10,<1.26",
    "structlog>=24.4,<25.0",
    "asgi-correlation-id>=4.3,<5.0",
    "tenacity>=9.0,<10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.26",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<0.23",
    "ruff>=0.7,<0.9",
    "mypy>=1.13,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pikepdf.*", "filetype.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
